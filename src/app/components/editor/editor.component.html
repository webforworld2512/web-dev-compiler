<div class="editor-container">
  <div class="editor-tabs" role="tablist" aria-label="Code editors">
    <button
      class="tab-btn tab-html"
      role="tab"
      [attr.aria-selected]="activeTab === 'html'"
      [class.active]="activeTab === 'html'"
      (click)="setActiveTab('html')"
    >
      <span class="tab-dot" aria-hidden="true"></span>
      index.html
    </button>
    <button
      class="tab-btn tab-css"
      role="tab"
      [attr.aria-selected]="activeTab === 'css'"
      [class.active]="activeTab === 'css'"
      (click)="setActiveTab('css')"
    >
      <span class="tab-dot" aria-hidden="true"></span>
      style.css
    </button>
    <button
      class="tab-btn tab-js"
      role="tab"
      [attr.aria-selected]="activeTab === 'js'"
      [class.active]="activeTab === 'js'"
      (click)="setActiveTab('js')"
    >
      <span class="tab-dot" aria-hidden="true"></span>
      script.js
    </button>
  </div>

  <div class="editor-content">
    <div
      id="html-editor"
      class="monaco-editor"
      [style.display]="activeTab === 'html' ? 'block' : 'none'"
    ></div>
    <div
      id="css-editor"
      class="monaco-editor"
      [style.display]="activeTab === 'css' ? 'block' : 'none'"
    ></div>
    <div
      id="js-editor"
      class="monaco-editor"
      [style.display]="activeTab === 'js' ? 'block' : 'none'"
    ></div>
  </div>
</div>
